<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue Board</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-view" class="login" hidden>
    <div class="login-card">
      <h1>Issue Board</h1>
      <p data-i18n="login.intro"></p>
      <p id="login-error" class="error" hidden></p>
      <a id="login-btn" class="btn primary" href="/auth/login" data-i18n="login.button"></a>
    </div>
  </section>

  <div id="app-view" class="app" hidden>
    <header class="topbar">
      <a id="brand" class="brand" target="_blank" rel="noopener" data-i18n-title="brand.title">
        <img id="brand-logo" class="brand-logo" alt="" hidden>
        <span>Issue Board</span>
      </a>
      <div class="controls">
        <div class="field repo-field">
          <span id="repo-label" data-i18n="repo.label"></span>
          <div class="dropdown" id="repo-dropdown">
            <button id="repo-btn" class="dropdown-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="repo-label repo-btn">
              <span id="repo-btn-text" class="dropdown-value"></span>
              <span class="caret" aria-hidden="true">&#9662;</span>
            </button>
            <div id="repo-menu" class="dropdown-menu" hidden>
              <input id="repo-filter" type="search" data-i18n-placeholder="repo.filter" autocomplete="off" spellcheck="false" aria-controls="repo-options">
              <div id="repo-options" class="dropdown-options" role="listbox" aria-labelledby="repo-label"></div>
            </div>
          </div>
        </div>
        <label class="field">
          <span data-i18n="scope.label"></span>
          <select id="scope-select" disabled></select>
        </label>
        <label class="field grow">
          <span data-i18n="filter.label"></span>
          <input id="filter-input" type="search" data-i18n-placeholder="filter.placeholder">
        </label>
        <button id="refresh-btn" class="btn icon" data-i18n-title="refresh" data-i18n-aria-label="refresh">&#8635;</button>
      </div>
      <div class="user">
        <a id="repo-link" class="btn primary" target="_blank" rel="noopener" hidden data-i18n="openInGitea"></a>
        <div class="dropdown user-dropdown" id="user-dropdown">
          <button id="user-btn" class="user-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu" data-i18n-title="user.menu" data-i18n-aria-label="user.menu">
            <img id="user-avatar" class="avatar" alt="">
            <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4.427 7.427 3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427Z"/></svg>
          </button>
          <div id="user-menu" class="menu" role="menu" hidden>
            <div class="menu-header"><span data-i18n="user.signedInAs"></span> <strong id="user-name"></strong></div>
            <div class="menu-divider"></div>
            <a id="user-profile" class="menu-item" role="menuitem" target="_blank" rel="noopener">
              <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 0 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/></svg>
              <span data-i18n="user.profile"></span>
            </a>
            <a id="user-settings" class="menu-item" role="menuitem" target="_blank" rel="noopener">
              <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 0a8.2 8.2 0 0 1 .701.031C9.444.095 9.99.645 10.16 1.29l.288 1.107c.018.066.079.158.212.224.231.114.454.243.668.386.123.082.233.09.299.071l1.103-.303c.644-.176 1.392.021 1.82.63.27.385.506.792.704 1.218.315.675.111 1.422-.364 1.891l-.814.806c-.049.048-.098.147-.088.294.016.257.016.515 0 .772-.01.147.038.246.088.294l.814.806c.475.469.679 1.216.364 1.891a7.977 7.977 0 0 1-.704 1.217c-.428.61-1.176.807-1.82.63l-1.102-.302c-.067-.019-.177-.011-.3.071a5.909 5.909 0 0 1-.668.386c-.133.066-.194.158-.211.224l-.29 1.106c-.168.646-.715 1.196-1.458 1.26a8.006 8.006 0 0 1-1.402 0c-.743-.064-1.289-.614-1.458-1.26l-.289-1.106c-.018-.066-.079-.158-.212-.224a5.738 5.738 0 0 1-.668-.386c-.123-.082-.233-.09-.299-.071l-1.103.303c-.644.176-1.392-.021-1.82-.63a8.12 8.12 0 0 1-.704-1.218c-.315-.675-.111-1.422.363-1.891l.815-.806c.05-.048.098-.147.088-.294a6.214 6.214 0 0 1 0-.772c.01-.147-.038-.246-.088-.294l-.815-.806C.635 6.045.431 5.298.746 4.623a7.92 7.92 0 0 1 .704-1.217c.428-.61 1.176-.807 1.82-.63l1.102.302c.067.019.177.011.3-.071.214-.143.437-.272.668-.386.133-.066.194-.158.211-.224l.29-1.106C6.009.645 6.556.095 7.299.03 7.53.01 7.764 0 8 0Zm-.571 1.525c-.036.003-.108.036-.137.146l-.289 1.105c-.147.561-.549.967-.998 1.189-.173.086-.34.183-.5.29-.417.278-.97.423-1.529.27l-1.103-.303c-.109-.03-.175.016-.195.045-.22.312-.412.644-.573.99-.014.031-.021.11.059.19l.815.806c.411.406.562.957.53 1.456a4.709 4.709 0 0 0 0 .582c.032.499-.119 1.05-.53 1.456l-.815.806c-.081.08-.073.159-.059.19.162.346.353.677.573.989.02.03.085.076.195.046l1.102-.303c.56-.153 1.113-.008 1.53.27.161.107.328.204.501.29.447.222.85.629.997 1.189l.289 1.105c.029.109.101.143.137.146a6.6 6.6 0 0 0 1.142 0c.036-.003.108-.036.137-.146l.289-1.105c.147-.561.549-.967.998-1.189.173-.086.34-.183.5-.29.417-.278.97-.423 1.529-.27l1.103.303c.109.029.175-.016.195-.045.22-.313.411-.644.573-.99.014-.031.021-.11-.059-.19l-.815-.806c-.411-.406-.562-.957-.53-1.456a4.709 4.709 0 0 0 0-.582c-.032-.499.119-1.05.53-1.456l.815-.806c.081-.08.073-.159.059-.19a6.464 6.464 0 0 0-.573-.989c-.02-.03-.085-.076-.195-.046l-1.102.303c-.56.153-1.113.008-1.53-.27a4.44 4.44 0 0 0-.501-.29c-.447-.222-.85-.629-.997-1.189l-.289-1.105c-.029-.11-.101-.143-.137-.146a6.6 6.6 0 0 0-1.142 0ZM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM9.5 8a1.5 1.5 0 1 0-3.001.001A1.5 1.5 0 0 0 9.5 8Z"/></svg>
              <span data-i18n="user.settings"></span>
            </a>
            <div class="menu-divider"></div>
            <button id="logout-btn" class="menu-item" role="menuitem" type="button">
              <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 2 13.25Zm10.44 4.5-1.97-1.97a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.97-1.97H6.75a.75.75 0 0 1 0-1.5Z"/></svg>
              <span data-i18n="user.logout"></span>
            </button>
          </div>
        </div>
      </div>
    </header>
    <main id="board" class="board"></main>
    <div id="empty-state" class="empty" hidden></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/vendor/Sortable.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
